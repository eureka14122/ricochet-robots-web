name: Test
on:
  push:
    branches:
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run regression suite
        run: npm test
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chinese font support for screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk >/dev/null
      - name: Run responsive browser smoke tests
        run: node tests/browser-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ricochet-ui-screenshots
          path: artifacts/*.png
          retention-days: 3
          if-no-files-found: ignore
